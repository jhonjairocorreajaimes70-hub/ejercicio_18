<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuentra REpositorios</title> 
    <link rel="stylesheet" href="css/styles.css"> 
</head> 
<body>
    <!-- Contenedor principal que simula la tarjeta de la interfaz -->
    <div class="tarjeta">
        <h2>Explora Repositorios con el lenguaje que deseas</h2> <!-- Título principal visible dentro de la tarjeta -->
        <!-- Menú desplegable para seleccionar el lenguaje de programación -->
        <div class="caja-seleccion">
            <select id="languageSelect">
                <option value="" disabled selected>Porfa selecciona un lenguaje</option>
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
            </select>
        </div>
        <!-- Contenedor donde cambiaremos dinámicamente los estados (vacío, cargando, error, resultado) -->
        <div id="resultContainer" class="contenedor-resultado estado-vacio">
            Porfa selecciona un lenguaje
        </div>
        <!-- Botón de refresco para buscar otro repositorio aleatorio (aparece tras una búsqueda exitosa) -->
        <button id="refreshBtn" class="btn-refrescar oculto">Refresh/Recargar</button>
    </div> <!-- Fin del contenedor principal -->
    <script src="script.js"></script> 
</html>
